        const active = ch.id === currentChapterId;
        return `
          <button onclick="selectChapter('${ch.id}')" class="w-full text-left px-3.5 py-3 rounded-lg transition-all border ${
            active
              ? "bg-blue-50 border-blue-500 text-blue-900 font-bold shadow-xs"
              : "bg-white border-transparent hover:bg-slate-100 text-slate-700"
          }">
            <div class="text-[11px] font-semibold text-blue-600 mb-0.5">${ch.badge}</div>
            <div class="text-sm leading-snug">${ch.title}</div>
          </button>
        `;
      }).join("");
    }

    function renderDoc() {
      const list = HUB_DATA[currentCategory];
      const doc = list.find((c) => c.id === currentChapterId) || list[0];
      const container = document.getElementById("doc-container");

      const heroHtml = doc.heroImage ? `
        <figure class="rounded-xl border border-slate-200 bg-slate-50 p-3 shadow-xs">
          <img src="${doc.heroImage}" alt="${doc.title}" class="w-full h-auto rounded-lg object-contain" />
          <figcaption class="mt-2.5 text-xs sm:text-sm text-center text-slate-600 font-medium">🖼️ ${doc.heroCaption || ""}</figcaption>
        </figure>
      ` : "";

      const sectionsHtml = doc.sections.map((s) => {
        const pHtml = (s.paragraphs || []).map((p) => `<p class="text-sm sm:text-base text-slate-700 leading-relaxed">${p}</p>`).join("");
        const bulletsHtml = s.bullets ? `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
            ${s.bullets.map((b) => `
              <div class="bg-slate-50 rounded-xl border border-slate-200 p-4">
                <div class="font-bold text-sm text-blue-900 mb-1.5">${b.label}</div>
                <div class="text-xs sm:text-sm text-slate-700 leading-relaxed">${b.desc}</div>
              </div>
            `).join("")}
          </div>
        ` : "";
        const tblHtml = s.table ? `
          <div class="overflow-x-auto rounded-xl border border-slate-200 shadow-2xs mt-3">
            <table class="min-w-full divide-y divide-slate-200 text-left text-xs sm:text-sm">
              <thead class="bg-slate-100 text-slate-800 font-bold">
                <tr>${s.table.headers.map((h) => `<th class="px-4 py-3">${h}</th>`).join("")}</tr>
              </thead>
              <tbody class="divide-y divide-slate-200 bg-white">
                ${s.table.rows.map((r) => `
                  <tr class="hover:bg-slate-50">
                    ${r.map((c, idx) => `<td class="px-4 py-3 leading-relaxed ${idx === 0 ? "font-bold text-slate-900 whitespace-nowrap" : "text-slate-700"}">${c}</td>`).join("")}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        ` : "";
        return `<section class="space-y-4"><h3 class="text-lg sm:text-xl font-bold text-slate-900 border-b border-slate-200 pb-2">${s.heading}</h3>${pHtml}${bulletsHtml}${tblHtml}</section>`;
      }).join("");

      const qaHtml = (doc.qa || []).map((item) => `
        <details class="group bg-white rounded-xl border border-blue-200 overflow-hidden shadow-2xs">
          <summary class="cursor-pointer p-4 flex items-start justify-between gap-3 hover:bg-blue-50/50 transition-colors">
            <div>
              <div class="text-xs font-bold text-blue-700 mb-1">[${item.role}]</div>
              <div class="font-bold text-sm sm:text-base text-slate-900">${item.q}</div>
            </div>
            <span class="px-2.5 py-1 rounded-md bg-blue-100 text-blue-800 text-xs font-bold shrink-0 group-open:bg-emerald-100 group-open:text-emerald-800">
              解答を見る ▼
            </span>
          </summary>
          <div class="p-4 pt-0 border-t border-slate-100 bg-emerald-50/30 text-xs sm:text-sm text-slate-800 leading-relaxed">
            <div class="mt-3"><span class="font-bold text-emerald-700">💡 模範解答・解説：</span> ${item.a}</div>
          </div>
        </details>
      `).join("");

      const vocabHtml = (doc.vocab || []).map((v) => `
        <div class="rounded-lg border border-slate-200 p-3.5 bg-white hover:border-blue-300 transition-colors">
          <div class="font-bold text-sm text-slate-900">${v.term}</div>
          <div class="text-xs text-slate-600 mt-1 leading-relaxed">${v.meaning}</div>
        </div>
      `).join("");

      container.innerHTML = `
        <article class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-blue-950 text-white p-6 sm:p-8">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-500/20 border border-blue-400/40 text-blue-200">${doc.badge}</span>
              <span class="text-xs text-slate-300 font-mono">📅 ${doc.date}</span>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold leading-tight">${doc.title}</h2>
            <p class="mt-2.5 text-sm sm:text-base text-blue-100 leading-relaxed">${doc.subtitle}</p>
          </div>

          <div class="p-6 sm:p-8 space-y-8">
            <div class="bg-amber-50 border-l-4 border-amber-500 rounded-r-xl p-5">
              <div class="text-xs font-bold uppercase tracking-wider text-amber-800 mb-1">💡 要点サマリー ＆ プロダクト開発 (SWE / PM) への示唆</div>
              <p class="text-sm sm:text-base text-slate-800 leading-relaxed font-medium">${doc.takeaway}</p>
            </div>

            ${heroHtml}
            ${sectionsHtml}

            <section class="bg-blue-50/70 rounded-xl border border-blue-200 p-5 space-y-3">
              <h3 class="text-base sm:text-lg font-bold text-blue-950 flex items-center gap-2">
                <span>🧠</span> インタラクティブ理解度チェック ＆ 面接Q&A（クリックで解答開閉）
              </h3>
              <div class="space-y-2.5">${qaHtml}</div>
            </section>

            <section class="space-y-3">
              <h3 class="text-base sm:text-lg font-bold text-slate-900 border-b border-slate-200 pb-2">📖 必須エンジニアリング＆ドメイン用語集</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${vocabHtml}</div>
            </section>
          </div>
        </article>
      `;
    }

    renderSidebar();
    renderDoc();
  </script>
</body>
</html>
