              <text x="24" y="48" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A" font-weight="600">01 / INGRESS &amp; CACHE</text>
              <text x="24" y="72" font-family="Inter, sans-serif" font-size="12" fill="#18181B" font-weight="600">Semantic Cache</text>
              <text x="24" y="90" font-family="Inter, sans-serif" font-size="10" fill="#52525B">Cosine Sim ≥ 0.95</text>
              <line x1="24" y1="104" x2="170" y2="104" stroke="#E4E4E7" stroke-width="1"/>
              <text x="24" y="124" font-family="Inter, sans-serif" font-size="12" fill="#18181B" font-weight="600">Model Router</text>
              <text x="24" y="142" font-family="Inter, sans-serif" font-size="10" fill="#52525B">Fast Classifier -&gt; Tiering</text>

              <line x1="185" y1="95" x2="215" y2="95" stroke="#71717A" stroke-width="1.2" marker-end="url(#arrow)"/>

              <!-- Layer 2 -->
              <rect x="220" y="25" width="180" height="140" rx="6" fill="#FFFFFF" stroke="#18181B" stroke-width="1.5"/>
              <text x="234" y="48" font-family="JetBrains Mono, monospace" font-size="10" fill="#18181B" font-weight="600">02 / REASONING CORE</text>
              <text x="234" y="72" font-family="Inter, sans-serif" font-size="12" fill="#18181B" font-weight="600">Agentic Loop (Sys 2)</text>
              <text x="234" y="90" font-family="Inter, sans-serif" font-size="10" fill="#52525B">Plan -&gt; Act -&gt; Observe</text>
              <line x1="234" y1="104" x2="386" y2="104" stroke="#E4E4E7" stroke-width="1"/>
              <text x="234" y="124" font-family="Inter, sans-serif" font-size="12" fill="#18181B" font-weight="600">KV Cache &amp; Prefill</text>
              <text x="234" y="142" font-family="Inter, sans-serif" font-size="10" fill="#52525B">Prompt Prefix Reuse</text>

              <line x1="400" y1="95" x2="430" y2="95" stroke="#71717A" stroke-width="1.2" marker-end="url(#arrow)"/>

              <!-- Layer 3 -->
              <rect x="435" y="25" width="180" height="140" rx="6" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.2"/>
              <text x="449" y="48" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A" font-weight="600">03 / CONTEXT &amp; TOOLS</text>
              <text x="449" y="72" font-family="Inter, sans-serif" font-size="12" fill="#18181B" font-weight="600">Hybrid RAG</text>
              <text x="449" y="90" font-family="Inter, sans-serif" font-size="10" fill="#52525B">Dense Vector + BM25</text>
              <line x1="449" y1="104" x2="601" y2="104" stroke="#E4E4E7" stroke-width="1"/>
              <text x="449" y="124" font-family="Inter, sans-serif" font-size="12" fill="#18181B" font-weight="600">MCP Server Bus</text>
              <text x="449" y="142" font-family="Inter, sans-serif" font-size="10" fill="#52525B">JSON-RPC 2.0 (DB/Git)</text>

              <line x1="615" y1="95" x2="645" y2="95" stroke="#71717A" stroke-width="1.2" marker-end="url(#arrow)"/>

              <!-- Layer 4 -->
              <rect x="650" y="25" width="160" height="140" rx="6" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.2"/>
              <text x="664" y="48" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A" font-weight="600">04 / EGRESS &amp; EVAL</text>
              <text x="664" y="72" font-family="Inter, sans-serif" font-size="12" fill="#18181B" font-weight="600">Structured Output</text>
              <text x="664" y="90" font-family="Inter, sans-serif" font-size="10" fill="#52525B">Strict JSON Schema</text>
              <line x1="664" y1="104" x2="796" y2="104" stroke="#E4E4E7" stroke-width="1"/>
              <text x="664" y="124" font-family="Inter, sans-serif" font-size="12" fill="#18181B" font-weight="600">SSE Streaming</text>
              <text x="664" y="142" font-family="Inter, sans-serif" font-size="10" fill="#52525B">TTFT &lt; 300ms</text>
            </svg>
          </div>
        `;
      }
      if (type === "db_storage") {
        return `
          <div class="my-6 p-5 bg-zinc-50/80 border border-zinc-200 rounded-lg">
            <div class="flex items-center justify-between mb-3">
              <span class="font-mono text-[11px] uppercase tracking-wider text-zinc-500">Storage Engine I/O Path Comparison</span>
              <span class="font-mono text-[11px] text-zinc-400">B+Tree vs. LSM-Tree</span>
            </div>
            <svg viewBox="0 0 820 165" class="w-full h-auto">
              <rect x="10" y="15" width="385" height="135" rx="6" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.2"/>
              <text x="26" y="40" font-family="JetBrains Mono, monospace" font-size="10" fill="#18181B" font-weight="600">B+TREE ENGINE (READ-OPTIMIZED / ACID RDB)</text>
              <text x="26" y="66" font-family="Inter, sans-serif" font-size="11" fill="#3F3F46">Root Node -&gt; Internal Pages -&gt; Doubly-Linked Leaf Pages (8KB/16KB)</text>
              <text x="26" y="92" font-family="JetBrains Mono, monospace" font-size="10" fill="#52525B">• Read: O(log_B N) — 3~4 page lookups (Fast Range Scan)</text>
              <text x="26" y="112" font-family="JetBrains Mono, monospace" font-size="10" fill="#52525B">• Write: In-place page overwrite (Random Disk I/O + WAL)</text>

              <rect x="425" y="15" width="385" height="135" rx="6" fill="#FFFFFF" stroke="#18181B" stroke-width="1.5"/>
              <text x="441" y="40" font-family="JetBrains Mono, monospace" font-size="10" fill="#18181B" font-weight="600">LSM-TREE ENGINE (WRITE-OPTIMIZED / WIDE-COLUMN)</text>
              <text x="441" y="66" font-family="Inter, sans-serif" font-size="11" fill="#3F3F46">Append WAL -&gt; RAM MemTable (SkipList) -&gt; Immutable SSTables</text>
              <text x="441" y="92" font-family="JetBrains Mono, monospace" font-size="10" fill="#52525B">• Write: 100% Sequential Append I/O (Ultra-high throughput)</text>
              <text x="441" y="112" font-family="JetBrains Mono, monospace" font-size="10" fill="#52525B">• Read: MemTable + Bloom Filter + Background Compaction</text>
            </svg>
          </div>
        `;
      }
      if (type === "epi_bathtub") {
        return `
          <div class="my-6 p-5 bg-zinc-50/80 border border-zinc-200 rounded-lg">
            <div class="flex items-center justify-between mb-3">
              <span class="font-mono text-[11px] uppercase tracking-wider text-zinc-500">Epidemiological Compartmental Flow</span>
              <span class="font-mono text-[11px] text-zinc-400">P / (1 - P) = I × D</span>
            </div>
            <svg viewBox="0 0 820 140" class="w-full h-auto">
              <rect x="20" y="30" width="210" height="80" rx="6" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.2"/>
              <text x="36" y="58" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A">INFLOW (RATE)</text>
              <text x="36" y="80" font-family="Inter, sans-serif" font-size="13" fill="#18181B" font-weight="600">Incidence Rate (I)</text>
              <text x="36" y="96" font-family="Inter, sans-serif" font-size="10" fill="#52525B">New cases / Person-Time</text>

              <line x1="230" y1="70" x2="295" y2="70" stroke="#18181B" stroke-width="1.5"/>

              <rect x="295" y="20" width="230" height="100" rx="6" fill="#18181B" stroke="#18181B" stroke-width="1.5"/>
              <text x="315" y="48" font-family="JetBrains Mono, monospace" font-size="10" fill="#A1A1AA">STOCK (POOL AT TIME t)</text>
              <text x="315" y="74" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">Prevalence Pool (P)</text>
              <text x="315" y="96" font-family="JetBrains Mono, monospace" font-size="11" fill="#E4E4E7">Steady State: P ≈ I × D</text>

              <line x1="525" y1="70" x2="590" y2="70" stroke="#18181B" stroke-width="1.5"/>

              <rect x="590" y="30" width="210" height="80" rx="6" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.2"/>
              <text x="606" y="58" font-family="JetBrains Mono, monospace" font-size="10" fill="#71717A">OUTFLOW (EXIT)</text>
              <text x="606" y="80" font-family="Inter, sans-serif" font-size="13" fill="#18181B" font-weight="600">Recovery + Mortality</text>
              <text x="606" y="96" font-family="Inter, sans-serif" font-size="10" fill="#52525B">Determines Mean Duration (D)</text>
            </svg>
          </div>
        `;
      }
      return "";
    }

    function updateTabStyles() {
      const cats = ["ai_news", "swe_pm", "phs"];
      cats.forEach((k) => {
        const btn = document.getElementById("tab-" + k);
        const mobBtn = document.getElementById("mob-tab-" + k);
        if (k === currentCategory) {
          if (btn) btn.className = "px-3 py-1 rounded text-xs font-medium transition-all bg-white text-zinc-900 shadow-xs border border-zinc-200/80";
          if (mobBtn) mobBtn.className = "px-2.5 py-1 rounded text-xs font-medium whitespace-nowrap bg-zinc-900 text-white";
        } else {
          if (btn) btn.className = "px-3 py-1 rounded text-xs font-medium transition-all text-zinc-600 hover:text-zinc-900";
          if (mobBtn) mobBtn.className = "px-2.5 py-1 rounded text-xs font-medium whitespace-nowrap text-zinc-600 bg-white border border-zinc-200";
        }
      });

      const labelMap = {
        ai_news: "AI ARCHITECTURE & DIGEST",
        swe_pm: "CS & PRODUCT ENGINEERING",
        phs: "EPIDEMIOLOGY & BIOSTATISTICS"
      };
      const lbl = document.getElementById("sidebar-category-label");
      if (lbl) lbl.textContent = labelMap[currentCategory] || "DOCUMENTS";
    }

    function switchCategory(cat) {
      currentCategory = cat;
      currentChapterId = HUB_DATA[cat][0].id;
      updateTabStyles();
      renderSidebar();
      renderDoc();
    }

    function selectChapter(id) {
      currentChapterId = id;
      renderSidebar();
      renderDoc();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function handleSearch(val) {
      searchQuery = (val || "").trim().toLowerCase();
      renderSidebar();
    }

    function renderSidebar() {
      const list = HUB_DATA[currentCategory].filter((ch) => {
        if (!searchQuery) return true;
        return JSON.stringify(ch).toLowerCase().includes(searchQuery);
      });
      const nav = document.getElementById("chapter-list");
      if (list.length === 0) {
        nav.innerHTML = `<div class="text-xs text-zinc-400 py-4 px-2">No matching documents found.</div>`;
        return;
      }
      if (!list.some((c) => c.id === currentChapterId)) {
        currentChapterId = list[0].id;
      }
      nav.innerHTML = list.map((ch) => {
        const active = ch.id === currentChapterId;
        return `
          <button onclick="selectChapter('${ch.id}')" class="w-full text-left px-2.5 py-2 rounded-md transition-colors group block ${
            active
              ? "bg-zinc-900 text-white"
              : "text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900"
          }">
            <div class="font-mono text-[10px] tracking-wider uppercase ${
              active ? "text-zinc-400" : "text-zinc-400 group-hover:text-zinc-500"
            }">${ch.badge}</div>
            <div class="text-xs font-medium leading-snug mt-0.5 line-clamp-2">${ch.title}</div>
          </button>
        `;
      }).join("");
    }

    function renderDoc() {
      const list = HUB_DATA[currentCategory];
      const doc = list.find((c) => c.id === currentChapterId) || list[0];
      const container = document.getElementById("doc-container");
      const tocContainer = document.getElementById("toc-list");

      // Render right TOC
      const tocItems = (doc.sections || []).map((s, idx) => {
        return `<a href="#sec-${idx}" class="block text-zinc-500 hover:text-zinc-900 leading-snug py-0.5 transition-colors">${s.heading}</a>`;
      });
      if (doc.qa && doc.qa.length > 0) {
        tocItems.push(`<a href="#sec-qa" class="block text-zinc-500 hover:text-zinc-900 leading-snug py-0.5 transition-colors">Review &amp; Case Questions</a>`);
      }
      if (doc.vocab && doc.vocab.length > 0) {
        tocItems.push(`<a href="#sec-vocab" class="block text-zinc-500 hover:text-zinc-900 leading-snug py-0.5 transition-colors">Terminology</a>`);
      }
      if (tocContainer) {
        tocContainer.innerHTML = tocItems.join("");
      }

      const cleanDiagramHtml = getCleanSvgDiagram(doc.diagramType);

      // Optional collapsible high-res slide figure (hidden by default so it never looks tacky/busy)
      const visualSlideHtml = doc.heroImage ? `
        <details class="my-4 group border border-zinc-200 rounded-md bg-white overflow-hidden">
          <summary class="px-3.5 py-2 text-xs font-mono text-zinc-500 hover:text-zinc-900 cursor-pointer flex items-center justify-between bg-zinc-50/60">
            <span>Figure Attachment: ${doc.heroCaption || "Architecture Slide"}</span>
            <span class="text-[10px] text-zinc-400 group-open:rotate-180 transition-transform">▼</span>
          </summary>
          <div class="p-3 border-t border-zinc-200 bg-zinc-50">
            <img src="${doc.heroImage}" alt="${doc.title}" class="w-full h-auto rounded border border-zinc-200" />
          </div>
        </details>
      ` : "";

      const sectionsHtml = (doc.sections || []).map((s, idx) => {
        const pHtml = (s.paragraphs || []).map((p) => `<p class="text-[15px] text-zinc-700 leading-[1.85] tracking-[-0.005em]">${p}</p>`).join("");
        const bulletsHtml = s.bullets ? `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
            ${s.bullets.map((b) => `
              <div class="bg-white rounded-md border border-zinc-200 p-4">
                <div class="font-mono text-xs font-semibold text-zinc-900 mb-1.5">${b.label}</div>
                <div class="text-xs text-zinc-600 leading-relaxed">${b.desc}</div>
              </div>
            `).join("")}
          </div>
        ` : "";
        const tblHtml = s.table ? `
          <div class="overflow-x-auto border border-zinc-200 rounded-md my-4">
            <table class="min-w-full divide-y divide-zinc-200 text-left text-xs">
              <thead class="bg-zinc-50 text-zinc-700 font-medium">
                <tr>${s.table.headers.map((h) => `<th class="px-4 py-2.5 font-semibold tracking-tight">${h}</th>`).join("")}</tr>
              </thead>
              <tbody class="divide-y divide-zinc-200 bg-white">
                ${s.table.rows.map((r) => `
                  <tr class="hover:bg-zinc-50/70 transition-colors">
                    ${r.map((c, cIdx) => `<td class="px-4 py-3 leading-relaxed align-top ${cIdx === 0 ? "font-medium text-zinc-900 whitespace-nowrap bg-zinc-50/30" : "text-zinc-600"}">${c}</td>`).join("")}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        ` : "";
        return `
          <section id="sec-${idx}" class="space-y-4 pt-6 border-t border-zinc-200/80 first:border-t-0 first:pt-0">
            <h2 class="text-lg font-semibold text-zinc-900 tracking-tight">${s.heading}</h2>
            <div class="space-y-3">${pHtml}</div>
            ${bulletsHtml}
            ${tblHtml}
          </section>
        `;
      }).join("");

      const qaHtml = (doc.qa || []).map((item) => `
        <details class="group bg-white rounded-md border border-zinc-200 overflow-hidden">
          <summary class="cursor-pointer px-4 py-3.5 flex items-start justify-between gap-4 hover:bg-zinc-50 transition-colors">
            <div class="space-y-1">
              <div class="font-mono text-[10px] uppercase tracking-wider text-zinc-400">${item.role}</div>
              <div class="font-medium text-sm text-zinc-900 leading-snug">${item.q}</div>
            </div>
            <span class="font-mono text-[11px] text-zinc-500 shrink-0 pt-0.5 group-open:text-zinc-900">
              Answer +
            </span>
          </summary>
          <div class="px-4 py-3.5 border-t border-zinc-100 bg-zinc-50/60 text-xs sm:text-sm text-zinc-700 leading-relaxed">
            ${item.a}
          </div>
        </details>
      `).join("");

      const vocabHtml = (doc.vocab || []).map((v) => `
        <div class="border-b border-zinc-200/80 pb-3 last:border-b-0">
          <dt class="font-mono text-xs font-semibold text-zinc-900">${v.term}</dt>
          <dd class="text-xs text-zinc-600 mt-1 leading-relaxed">${v.meaning}</dd>
        </div>
      `).join("");

      container.innerHTML = `
        <article class="bg-white border border-zinc-200/90 rounded-lg p-6 sm:p-10 shadow-[0_1px_2px_rgba(0,0,0,0.03)] space-y-8">
          <!-- Clean Editorial Document Header -->
          <header class="border-b border-zinc-200 pb-6 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <span class="font-mono text-[11px] font-medium uppercase tracking-wider text-zinc-500">${doc.badge}</span>
              <span class="font-mono text-[11px] text-zinc-400">${doc.date}</span>
            </div>
            <h1 class="text-2xl sm:text-[28px] font-bold text-zinc-950 tracking-tight leading-[1.3]">${doc.title}</h1>
            <p class="text-sm sm:text-base text-zinc-500 leading-relaxed">${doc.subtitle}</p>
          </header>

          <!-- Executive Summary Callout (Minimal Monochrome Left Border) -->
          <div class="bg-zinc-50 border-l-2 border-zinc-900 px-5 py-4">
            <div class="font-mono text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Abstract &amp; Engineering Implication</div>
            <p class="text-xs sm:text-sm text-zinc-800 leading-relaxed">${doc.takeaway}</p>
          </div>

          ${cleanDiagramHtml}
          ${visualSlideHtml}

          <div class="space-y-8">
            ${sectionsHtml}
          </div>

          <!-- Technical Review & Case Q&A -->
          <section id="sec-qa" class="pt-6 border-t border-zinc-200 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-base font-semibold text-zinc-900 tracking-tight">Architecture &amp; Design Review Questions</h2>
              <span class="font-mono text-[11px] text-zinc-400">Click to reveal</span>
            </div>
            <div class="space-y-2.5">${qaHtml}</div>
          </section>

          <!-- Terminology Glossary -->
          <section id="sec-vocab" class="pt-6 border-t border-zinc-200 space-y-4">
            <h2 class="text-base font-semibold text-zinc-900 tracking-tight">Technical Glossary</h2>
            <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4">${vocabHtml}</dl>
          </section>
        </article>
      `;
    }

    updateTabStyles();
    renderSidebar();
    renderDoc();
  </script>
</body>
</html>
